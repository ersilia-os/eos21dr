Identifier: eos21dr
Slug: antimicrobial-activity-abaumannii
Status: Ready
Title: Antimicrobial activity prediction against Acinetobacter baumannii from 
  public ChEMBL data
Description: Bioactivity prediction of growth inhibition in Acinetobacter 
  baumannii, trained as binary (active/inactive) classifiers from publicly 
  available data in ChEMBL. Independent models are trained on multiple 
  bioactivity datasets, corresponding to single point (e.g. percent effect) and 
  dose-response (MIC) assays. A ranking score is provided for each model 
  alongside a combined consensus score.
