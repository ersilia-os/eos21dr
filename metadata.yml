Identifier: eos21dr
Slug: antimicrobial-activity-abaumannii
Status: Ready
Title: Antimicrobial activity prediction against Acinetobacter baumannii from 
  public ChEMBL data
Description: Ranks compounds by their likelihood of inhibiting Acinetobacter baumannii
  growth, drawing on bioactivity records deposited in ChEMBL. Separate binary classifiers
  were trained over each usable assay pool, keeping single-point percentage-inhibition
  measurements apart from dose-response MIC determinations since the two express activity
  on different terms. Every classifier contributes its own ranked probability, and
  these are folded into a quality-weighted consensus that gives more influence to
  models built on larger, better-populated pools.
