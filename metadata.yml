Status: In progress
Title: Antimicrobial activity prediction against Acinetobacter baumannii from 
  public ChEMBL data
Description: Binary classifier predicting antimicrobial activity against 
  Acinetobacter baumannii from publicly available ChEMBL bioactivity data. 
  Independent models are trained on multiple bioactivity endpoints using 
  LazyQSAR (ersilia-os/chembl-antimicrobial-tasks, 
  ersilia-os/chembl-antimicrobial-models), returning one score per endpoint 
  alongside a combined consensus score.
